<!doctype html>
<!--
  Source of public/img/og-image.png, the 1200x630 link preview image (og:image). Not deployed.
  Regenerate from the landing/ folder (Windows, Git Bash). A separate --user-data-dir lets it run while Edge is open:
    "/c/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" --headless=new --disable-gpu --hide-scrollbars \
      --no-first-run --user-data-dir="$TEMP/og-edge-profile" --virtual-time-budget=3000 --window-size=1200,630 \
      --screenshot="$(pwd -W)\public\img\og-image.png" "file:///$(pwd -W)/og/og-image.html"
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('../public/fonts/inter-latin-wght-normal.woff2') format('woff2-variations'); }
    @font-face { font-family: 'Jakarta'; font-weight: 200 800; src: url('../public/fonts/plus-jakarta-sans-latin-wght-normal.woff2') format('woff2-variations'); }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative; font-family: 'Inter', sans-serif; color: #fff;
      background:
        radial-gradient(700px 300px at 92% 0%, rgba(169, 227, 75, 0.16), transparent 60%),
        linear-gradient(135deg, #3d4a8c 0%, #4e4785 100%);
    }
    /* Faint gauge arcs, as on the landing page hero */
    body::after {
      content: ''; position: absolute; left: -120px; bottom: -220px; width: 440px; height: 440px; border-radius: 50%;
      border: 40px solid rgba(255, 255, 255, 0.05); box-shadow: 0 0 0 56px rgba(255, 255, 255, 0.025);
    }
    .text { position: absolute; left: 72px; top: 64px; width: 540px; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand img { width: 56px; height: 56px; }
    .wordmark { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; }
    .wordmark span { color: #91a7ff; }
    .eyebrow { margin-top: 56px; color: #c0eb75; font-size: 16px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { margin-top: 14px; font-family: 'Jakarta', sans-serif; font-size: 54px; line-height: 1.12; font-weight: 700; letter-spacing: -0.01em; }
    .url { position: absolute; left: 72px; bottom: 56px; font-size: 22px; font-weight: 600; color: rgba(255, 255, 255, 0.85); z-index: 1; }
    /* The real app, cut off at the right and bottom edges */
    .shot {
      position: absolute; left: 660px; top: 92px; width: 600px; border-radius: 14px; overflow: hidden; background: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    .bar { display: flex; gap: 7px; padding: 11px 14px; background: rgba(16, 24, 64, 0.05); }
    .bar span { width: 11px; height: 11px; border-radius: 50%; background: rgba(16, 24, 64, 0.18); }
    .shot img { display: block; width: 100%; }
  </style>
</head>
<body>
  <div class="text">
    <div class="brand">
      <img src="../public/favicon.svg" alt="">
      <div class="wordmark">Know<span>Gauge</span></div>
    </div>
    <div class="eyebrow">AI-powered · Grounded in your sources</div>
    <h1>Turn your documents into tests you can trust</h1>
  </div>
  <div class="url">knowgauge.com</div>
  <div class="shot">
    <div class="bar"><span></span><span></span><span></span></div>
    <img src="../public/img/app-test-screen-light.png" alt="">
  </div>
</body>
</html>
